<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
      form { display: grid; gap: 10px; }
      input, button { padding: 10px; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Login</h1>
    {% if request.query_params.get('error') %}
      <p class="error">{{ request.query_params.get('error') }}</p>
    {% endif %}
    <form method="post" action="/api/auth/web-login">
      <input name="username" type="text" placeholder="Username" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Sign in</button>
    </form>
    <p><a href="/register-page">Create account</a></p>
  </body>
</html>
