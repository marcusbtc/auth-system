name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Tests
        env:
          MONGO_URI: mongomock://localhost
          MONGO_DB: auth_system_test
          JWT_SECRET: test-secret-with-at-least-32-characters-123
          DEBUG_EXPOSE_TOKENS: true
          ADMIN_SEED_ENABLED: true
          ADMIN_SEED_USERNAME: admin
          ADMIN_SEED_PASSWORD: password
          COOKIE_SECURE: false
          COOKIE_SAMESITE: lax
          APP_ENV: test
        run: pytest
