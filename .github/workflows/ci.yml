name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Tests
        env:
          MONGO_URI: mongomock://localhost
          MONGO_DB: auth_system_test
          JWT_SECRET: test-secret-with-at-least-32-characters-123
          DEBUG_EXPOSE_TOKENS: true
          ADMIN_SEED_ENABLED: true
          ADMIN_SEED_USERNAME: admin
          ADMIN_SEED_PASSWORD: password
          COOKIE_SECURE: false
          COOKIE_SAMESITE: lax
          APP_ENV: test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=79
      - name: Dependency audit
        run: pip-audit --requirement requirements.txt --strict

  container:
    runs-on: ubuntu-latest
    needs: quality
    env:
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      APP_ENV: production
      COOKIE_SECURE: 'true'
      ADMIN_SEED_ENABLED: 'false'
      MONGO_USER: auth_system
      MONGO_PASSWORD: ci-only-mongo-password
      MONGO_URI: mongodb://auth_system:ci-only-mongo-password@mongo:27017/auth_system?authSource=admin
      REDIS_PASSWORD: ci-only-redis-password
      REDIS_URL: redis://:ci-only-redis-password@redis:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build api
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auth-system:local
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test health and readiness
        run: |
          docker compose up --detach --wait
          curl --fail --silent --show-error http://127.0.0.1:8000/api/system/health
          curl --fail --silent --show-error http://127.0.0.1:8000/api/system/ready
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down smoke stack
        if: always()
        run: docker compose down --volumes
